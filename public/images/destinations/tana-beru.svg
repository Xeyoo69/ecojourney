<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#000" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.3"/>
    </linearGradient>
    <pattern id="pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#pattern)"/>

  <!-- Decorative Landscape Shapes -->
  <path d="M0 340 Q 200 240, 400 320 T 800 280 L 800 500 L 0 500 Z" fill="#ffffff" fill-opacity="0.07"/>
  <path d="M0 390 Q 250 300, 500 370 T 800 330 L 800 500 L 0 500 Z" fill="#ffffff" fill-opacity="0.1"/>
  <path d="M0 430 Q 300 360, 600 420 T 800 390 L 800 500 L 0 500 Z" fill="#ffffff" fill-opacity="0.15"/>

  <!-- Sun / Moon -->
  <circle cx="680" cy="120" r="45" fill="#ffffff" fill-opacity="0.2"/>
  <circle cx="680" cy="120" r="32" fill="#ffffff" fill-opacity="0.35"/>

  <!-- Gradient Overlay -->
  <rect width="800" height="500" fill="url(#overlay)"/>

  <!-- Badge -->
  <g transform="translate(48, 48)">
    <rect width="130" height="32" rx="16" fill="#ffffff" fill-opacity="0.2"/>
    <circle cx="16" cy="16" r="4" fill="#34d399"/>
    <text x="28" y="21" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="1.5">INDONESIA</text>
  </g>

  <!-- Typography -->
  <g transform="translate(48, 380)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#a7f3d0" letter-spacing="2">DESTINASI PILIHAN</text>
    <text x="0" y="42" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="38" font-weight="800" fill="#ffffff">Tana Beru</text>
    <text x="0" y="74" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="500" fill="#e2e8f0" fill-opacity="0.9">Sulawesi Selatan • Galangan Pinisi</text>
  </g>
</svg>