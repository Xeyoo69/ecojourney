<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoJourney — Offline</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 32px;
            text-align: center;
            background: #f2f7f3;
            color: #223b2b;
        }
        .badge {
            display: flex;
            height: 72px;
            width: 72px;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            background: #31583d;
            color: #fff;
            box-shadow: 0 18px 40px rgba(49, 88, 61, 0.22);
        }
        h1 { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; }
        p { max-width: 34ch; font-size: 0.95rem; line-height: 1.6; color: #4b5b50; }
        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0 22px;
            border-radius: 14px;
            background: #31583d;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
            transition: background 0.15s ease;
        }
        a:hover, a:focus-visible { background: #294733; outline: none; }
    </style>
</head>
<body>
    <div class="badge" aria-hidden="true">
        <img src="images/logo-ecojourney.png" alt="EcoJourney" width="40" height="40">
    </div>
    <h1>You're offline</h1>
    <p>It looks like you've lost your connection. Your saved destinations are still available once you're back online.</p>
    <a href="/">Try again</a>
</body>
</html>
